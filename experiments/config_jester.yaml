# Configuration for Jester Gesture Recognition Training (Windows CPU Test)

# Model configuration
model:
  num_classes: 27
  vit_model: "vit_base_patch16_224"
  vit_pretrained: true
  ssm_layers: 4
  ssm_d_state: 16
  ssm_d_conv: 4
  ssm_expand: 2

# Data configuration
data:
  root_dir: "data/jester"  # Ensure this path exists, even with dummy data
  num_frames: 16
  frame_size: 160
  batch_size: 2          # Reduced to 2 for CPU testing
  num_workers: 0         # MUST be 0 for Windows compatibility

# Training configuration
training:
  epochs: 5
  learning_rate: 3e-4
  optimizer: "adamw"
  weight_decay: 0.01
  gradient_clip: 1.0
  warmup_epochs: 1

# DDP configuration
ddp:
  world_size: 2
  rank: 0                # Overridden by env vars
  master_addr: "127.0.0.1" # Placeholder
  master_port: 29500

# Paths
paths:
  checkpoint_dir: "checkpoints"
  log_dir: "logs"